    <rect x="20" y="0" width="16" height="16" fill="#7fba00" />
    <rect x="0" y="20" width="16" height="16" fill="#00a4ef" />
    <rect x="20" y="20" width="16" height="16" fill="#ffb900" />
  </g>
  <!-- Microsoft Text -->
  <text x="60" y="37" font-family="'Segoe UI', 'Open Sans', 'Helvetica Neue', Arial, sans-serif" font-size="24" font-weight="600" fill="#222222">Microsoft</text>
  <text x="175" y="37" font-family="'Segoe UI', 'Open Sans', 'Helvetica Neue', Arial, sans-serif" font-size="13" font-weight="500" fill="#666666">India</text>
